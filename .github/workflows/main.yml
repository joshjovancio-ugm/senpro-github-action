name: Test, Build, and Deploy | Modul 01 Lab2.2 Senior Project

on:
  push:
    branches: [ main ]

jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x]
    steps:
      - uses: actions/checkout@v4
      - name: Testing Build pre-Deploy
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm install
      - run: npm run build

  deploy:
    needs: test-build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x]

    steps:
      - name: Build app on VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            cd "C:\Users\Josh Jovancio\SenPro"
            
            if not exist "senpro-github-action" (
                echo "Repository missing. Cloning..."
                git clone https://github.com/joshjovancio-ugm/senpro-github-action.git
            )
            
            cd "senpro-github-action"
            echo "Updating repository..."
            git restore .
            git pull origin main
            
            echo "Installing dependencies and building..."
            call npm install
            call npm run build